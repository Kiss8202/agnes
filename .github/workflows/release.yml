name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'install.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: |
          VERSION=$(sed -n 's/^MODULE_VERSION="\([^"]*\)".*/\1/p' modules/core.sh | head -1)
          if [[ -z "$VERSION" ]]; then
            echo "错误: 无法读取 MODULE_VERSION"
            exit 1
          fi
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION: v${VERSION}"

      - name: Package
        run: |
          mkdir -p /tmp/sb-modules
          cp modules/*.sh /tmp/sb-modules/
          cd /tmp
          tar czf sb-modules.tar.gz -C sb-modules .
          sha256sum sb-modules.tar.gz | awk '{print $1}' > sb-modules.tar.gz.sha256
          cp sb-modules.tar.gz sb-modules.tar.gz.sha256 "$GITHUB_WORKSPACE/"

      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="自动构建 - ${{ steps.ver.outputs.version }}

          使用方法：
          \`\`\`bash
          bash <(curl -sfL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh)
          \`\`\`"
          gh release create "latest" \
            -R "$GITHUB_REPOSITORY" \
            --title "sing-box 管理脚本 ${{ steps.ver.outputs.version }}" \
            --notes "$NOTES" \
            sb-modules.tar.gz sb-modules.tar.gz.sha256
